[workspace]
channels = ["conda-forge"]
name = "xpd-profile-collection"
platforms = ["linux-64"]
version = "2026.2.0"

[system-requirements]
libc = "2.17"

[feature.profile.dependencies]
bluesky-base = "==1.15.1"
bluesky-queueserver = "*"
matplotlib-base= ">=3.10"
networkx = ">=3.4.2,<4"
nslsii = "==0.11.8"
numpy = "*"
ophyd = "==1.11.0"
pyepics = "*"
python = ">=3.12,<3.13"
semver = ">=3.0.4,<4"
tiled-client = "==0.2.9"
# needed until we get ophyd-async packaged
colorlog = ">=6.9.0,<7"
xpdan = ">=0.8.2,<0.9"
#xpdacq = ">=1.1.4,<2"
xpdacq = "==1.0.0"
databroker = "==2.0.0b68"
bluesky-tiled-plugins = "==2.0.2"
lmfit = ">=1.3.4,<2"
bluesky-darkframes = ">=0.6.0,<0.7"
hdf5-external-filter-plugins = ">=0.1.0,<0.2"
blosc-hdf5-plugin = ">=1.0.1,<2"
pydantic-numpy = ">=8.0.0,<9"
p4p = ">=4.2.0,<5"
epicscorelibs = ">=7.0.7.99.1.1,<8"


[feature.profile.pypi-dependencies]
ophyd-async = { version = ">0.10.0", extras = ["ca", "pva"] }

[feature.qs.dependencies]
bluesky-queueserver = "*"
bluesky-httpserver = "*"

[feature.qs.tasks]
# This section needs some development work to understand the best way to
# thread the required configuration through both the task and files checked into
# the profile.  These will interact with the ansible roles for pushing out the
# systemd units
qs-backend = "start-re-manager --profile-dir=."
qs-server = "uvicorn --host localhost --port 60610 bluesky_httpserver.server:app"

[feature.terminal.dependencies]
ipython = ">=9.5.0"
pyside6 = "*"
numpy = ">2"
pymatgen = "*"
botorch = "*"
gpytorch = "*"
"diffpy.pdffit2" = "*"
"diffpy.structure" = "*"

[feature.terminal.pypi-dependencies]
blop = { git = "https://github.com/bluesky/blop.git", rev = "testing-xpd", extras = ["cpu"] }

[feature.terminal.tasks]
start = "unset SESSION_MANAGER && MPLBACKEND=qtagg ipython --profile-dir=$HOME/.ipython/profile_$BS_PROFILE"
pvs = "ipython --profile-dir=. -c 'get_pv_types(); exit()'"
git-install-bluesky = "pip install -v git+https://github.com/bluesky/bluesky.git"

[environments]
terminal = {features=["profile", "terminal"], solve-group="profile"}
qs = {features=["profile", "qs"], solve-group="profile"}

[dependencies]
setuptools = "==81.0.0"
